<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enter Score</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container mt-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="card shadow">

        <div class="card-body">

            <h2>Enter Student Score</h2>

            <p>
                <strong>Student:</strong>
                {{ student.first_name }} {{ student.last_name }}
            </p>

            <p>
                <strong>Admission Number:</strong>
                {{ student.admission_number }}
            </p>

            <hr>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Subject
                    </label>

                    <select
                        name="subject"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Subject
                        </option>

                        {% for subject in subjects %}

                        <option value="{{ subject.id }}">
                            {{ subject.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Academic Session
                    </label>

                    <select
                        name="academic_session"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Academic Session
                        </option>

                        {% for session in academic_sessions %}

                        <option value="{{ session.id }}">
                            {{ session }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        CA Score
                    </label>

                    <input
                        type="number"
                        name="ca_score"
                        class="form-control"
                        min="0"
                        max="30"
                        step="0.5"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Exam Score
                    </label>

                    <input
                        type="number"
                        name="exam_score"
                        class="form-control"
                        min="0"
                        max="70"
                        step="0.5"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Save Score
                </button>
                <a href="{% url 'student_result' student.id %}"
                    class="btn btn-info"
                >
                    View Result Summary
                </a>
                <a
                    href="{% url 'teacher_dashboard' %}"
                    class="btn btn-secondary"
                >
                    Back
                </a>
    

            </form>

        </div>

    </div>

</div>

</body>

</html>
