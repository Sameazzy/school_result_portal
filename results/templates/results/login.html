<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <!-- Main login container -->
    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-6 col-lg-5">

                <!-- Login card -->
                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Student Login
                        </h2>

                        <!-- Display an error if login fails -->
                        {% if error %}

                        <div class="alert alert-danger">

                            {{ error }}

                        </div>

                        {% endif %}


                        <!-- Login form -->
                        <form method="POST" action="{% url 'student_login' %}">

                            <!-- Django security token -->
                            {% csrf_token %}


                            <!-- Username input -->
                            <div class="mb-3">

                                <label
                                    for="username"
                                    class="form-label"
                                >

                                    Username

                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    id="username"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Password input -->
                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >

                                    Password

                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    id="password"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <!-- Login button -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >

                                Login

                            </button>
                            <div class="text-center mt-3">

                                <p>
                                    Don't have an account?
                                </p>

                                <a
                                    href="{% url 'student_register' %}"
                                    class="btn btn-outline-primary"
                                >

                                    Register as a Student

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
